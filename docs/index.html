<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="minimum-scale=1.0, width=device-width, maximum-scale=1.0, user-scalable=no, initial-scale=1">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <title>WildThinks</title>

 <!--- <base
    href="https://unpkg.com/smartdown/dist/lib/"> --->

  <link
    rel=stylesheet
    href="https://unpkg.com/smartdown/dist/lib/fonts.css">
  <link
    rel=stylesheet
    href="https://unpkg.com/smartdown/dist/lib/smartdown.css">
  <script
    src="https://unpkg.com/smartdown/dist/lib/smartdown.js">
  </script>

  <link
    rel=stylesheet
    href="wildthinks-smartdown.css">


  <style type="text/css">
    html,
    * {
        -webkit-touch-callout: none;
        /*-webkit-user-select: none; */ /* Disable selection/copy in UIWebView */
    }

  </style>


</head>

<body
  style="margin:0;padding:0;background:white;">
  <div
    class="container-fluid"
    style="margin:0;padding:5px;">
    <div
      class="wildthinks-theme smartdown-container"
      id="smartdown-output">
    </div>
  </div>

  <script src="https://unpkg.com/smartdown/dist/lib/starter.js"></script>
  <script>
    window.smartdownBaseURL = 'https://unpkg.com/smartdown/dist/';
    window.smartdownResourceURL = 'https://unpkg.com/smartdown-gallery/resources/';
    window.smartdownDefaultHome = 'Home';
    window.smartdownStarter();
  </script>

  <script>
    document.body.addEventListener('touchmove', function(event) {
    /*console.log('event', event, event.srcElement, event.srcElement.classList);*/
    if (event.srcElement.tagName === 'CANVAS') {
      /*console.log('INHIBIT', event.srcElement);*/
      event.preventDefault();
    }
  }, {capture: true, passive : false});
  </script>

</body>
</html>
